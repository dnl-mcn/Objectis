<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>Objectis Framework - Dynamic Data Vault</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <link rel="stylesheet" type="text/css" href="css/button.css">
    <link rel="stylesheet" type="text/css" href="css/panel.css">
</head>
<body>

    <div id="main-container">
        <div class="obj-panel opt-title-Modulo_Cifratura">
            <p>I dati verranno salvati nell'oggetto generato dinamicamente.</p>
            <div id="btn-save-custom" class="obj-button opt-label-Cifra_Locale"></div>
        </div>

        <div class="obj-panel opt-title-Modulo_Sincronizzazione">
            <p>Scarica dati dal server e caricali nel Vault dinamico:</p>
            <div id="btn-ajax-test" class="obj-button opt-label-Sincronizza_Server"></div>
        </div>

        <div class="obj-panel opt-title-Console_Log">
            <div id="system-log-container" style="height: 150px; overflow-y: auto; background: #000; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px;">
                Objectis: [SYSTEM] In attesa...
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/core/Objectis.js"></script>

</body>
</html>
