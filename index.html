<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="it">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Objectis Framework - Clean Entry Point</title>
    <script type="text/javascript" src="js/core/Core.js"></script>
</head>
<body>

    <div id="wrapper">
        <h1>Objectis Clean Test</h1>

        <div id="pnl-1" class="obj-panel">
            <h3>Statistiche Live</h3>
            <p class="obj-bind" obj-key="click_count">0</p>
            
            <div id="btn-1" class="obj-button" obj-label="Incrementa"></div>
        </div>

        <div id="pnl-2" class="obj-panel">
            <h3>Pannello Secondario</h3>
            <div id="btn-2" class="obj-button" obj-label="Annulla" obj-color="#dc3545">Loading...</div>
        </div>

        <div id="obj-debug-log">
            <div>[Console di Sistema]</div>
        </div>
    </div>

</body>
</html>
